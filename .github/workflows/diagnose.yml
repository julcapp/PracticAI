name: 🔍 Diagnose Server

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Run diagnostics & upload result via FTP
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Собираем диагностику
          {
            echo "=== TIMESTAMP ==="
            date

            echo ""
            echo "=== HTTP practicai.ru ==="
            HTTP_CODE=$(curl -s -o /tmp/http_body.txt -w "%{http_code}" --max-time 15 "http://practicai.ru/" 2>&1)
            echo "Code: $HTTP_CODE"
            echo "Body first 200 chars:"
            head -c 200 /tmp/http_body.txt

            echo ""
            echo ""
            echo "=== HTTP HEADERS ==="
            curl -sI --max-time 10 "http://practicai.ru/" 2>&1

            echo ""
            echo "=== FTP /practicai.ru/ ==="
            curl -sl --max-time 15 "ftp://ftp7.hostland.ru/practicai.ru/" \
              --user "host1688282_practicai:${FTP_PASS}" 2>&1 || echo "ERR"

            echo ""
            echo "=== FTP /practicai.ru/htdocs/ ==="
            curl -sl --max-time 15 "ftp://ftp7.hostland.ru/practicai.ru/htdocs/" \
              --user "host1688282_practicai:${FTP_PASS}" 2>&1 || echo "ERR"

            echo ""
            echo "=== FTP /practicai.ru/htdocs/www/ ==="
            curl -sl --max-time 15 "ftp://ftp7.hostland.ru/practicai.ru/htdocs/www/" \
              --user "host1688282_practicai:${FTP_PASS}" 2>&1 || echo "ERR"

            echo ""
            echo "=== FTP /practicai.ru/projects/ ==="
            curl -sl --max-time 15 "ftp://ftp7.hostland.ru/practicai.ru/projects/" \
              --user "host1688282_practicai:${FTP_PASS}" 2>&1 || echo "ERR"

            echo ""
            echo "=== FTP /practicai.ru/projects/www/ ==="
            curl -sl --max-time 15 "ftp://ftp7.hostland.ru/practicai.ru/projects/www/" \
              --user "host1688282_practicai:${FTP_PASS}" 2>&1 || echo "ERR"

          } > /tmp/diag_result.txt

          echo "=== Diagnostic result ==="
          cat /tmp/diag_result.txt

          echo ""
          echo "=== Uploading to FTP ==="
          curl -T /tmp/diag_result.txt \
            "ftp://ftp7.hostland.ru/practicai.ru/htdocs/www/diag.txt" \
            --user "host1688282_practicai:${FTP_PASS}" \
            --max-time 30 && echo "FTP upload OK" || echo "FTP upload FAIL"
