name: 🚀 Deploy to Hostland — practicai.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: FTP Deploy → practicai.ru
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 npm install (production)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 Install dependencies
        run: npm ci --omit=dev

      - name: 📝 Создать .env файл
        run: |
          cat > .env << EOF
          NODE_ENV=production
          PORT=3000
          ALLOWED_ORIGIN=https://practicai.ru
          DB_HOST=localhost
          DB_USER=host1688282_practicai
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=host1688282_practicai
          DB_PORT=3306
          EOF

      - name: 📡 FTP Deploy → ftp7.hostland.ru
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ftp7.hostland.ru
          username:    host1688282_practicai
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        21
          protocol:    ftp
          server-dir:  /practicai.ru/htdocs/www/
          local-dir:   ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .env.example
            README.md
            *.log
