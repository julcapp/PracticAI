name: 🚀 Deploy PracticAI → Hostland

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: 🔧 npm install
        run: npm install --omit=dev

      - name: 📝 Создать .env
        run: |
          printf 'NODE_ENV=production\nPORT=3000\nALLOWED_ORIGIN=https://practicai.ru\nDB_HOST=localhost\nDB_USER=host1688282_practicai\nDB_PASSWORD=%s\nDB_NAME=host1688282_practicai\nDB_PORT=3306\n' \
            "${{ secrets.DB_PASSWORD }}" > .env

      - name: 🔄 Обновить tmp/restart.txt
        run: |
          mkdir -p tmp
          date +%s > tmp/restart.txt

      - name: 📡 Deploy → /projects/www/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ftp7.hostland.ru
          username:    host1688282_practicai
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        21
          protocol:    ftp
          server-dir:  /practicai.ru/projects/www/
          local-dir:   ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*/**
            .github/**
            .env.example
            README.md
            *.log
            node_modules/.cache/**
            htdocs_only/**
            diagnostics/**

      - name: 📡 Deploy → /projects/digital/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ftp7.hostland.ru
          username:    host1688282_practicai
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        21
          protocol:    ftp
          server-dir:  /practicai.ru/projects/digital/
          local-dir:   ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*/**
            .github/**
            .env.example
            README.md
            *.log
            node_modules/.cache/**
            htdocs_only/**
            diagnostics/**
