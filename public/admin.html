<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CRM · PracticAI</title><style>
:root{font-family:Arial,sans-serif;color:#183456;background:#f2f6fb}*{box-sizing:border-box}body{margin:0;font-size:16px;line-height:1.5}header{background:#143154;color:white;padding:18px 24px}header a{color:#b5e7ff}main{max-width:1200px;margin:30px auto;padding:0 20px}nav{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:0;border-radius:7px;background:#167ac0;color:white;padding:9px 14px}button.ghost{background:#e1ecf7;color:#153156}button.danger{background:#bd3243}.panel{background:white;border:1px solid #dce5f0;border-radius:12px;padding:22px;margin:15px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{font-weight:700;display:block;margin:12px 0}input,textarea,select{font:inherit;padding:10px;border:1px solid #aebed0;border-radius:6px;width:100%;margin-top:5px}textarea{min-height:130px}h1{font-size:28px;margin:0}h2{font-size:22px;margin:0 0 12px}.item{border-top:1px solid #dce5f0;padding:15px 0}.item:first-child{border:0}.meta{color:#61778e;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none}#message{min-height:24px;color:#9c2539}.status{max-width:180px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>PracticAI · CRM</h1><a href="/">На сайт</a> · <a href="/education.html">Образование</a></header><main><p>Меняйте тексты, создавайте разделы и работайте с обращениями. Сохранённые опубликованные разделы появляются на сайте сразу.</p><nav><button id="tab-content">Тексты и разделы</button><button id="tab-contacts" class="ghost">Обратная связь</button></nav><p id="message" role="status"></p><section id="content-panel"><div class="panel"><h2>Быстрое изменение текста</h2><form id="texts-form"><label>Заголовок главной<input id="main_title" maxlength="3000"></label><label>Текст в блоке связи на главной<textarea id="main_contact_intro" maxlength="3000"></textarea></label><label>Заголовок страницы образования<input id="education_title" maxlength="3000"></label><label>Вводный текст об образовании<textarea id="education_intro" maxlength="3000"></textarea></label><button type="submit">Сохранить тексты</button></form></div><div class="panel"><h2 id="form-title">Добавить раздел</h2><form id="section-form"><input type="hidden" id="id"><div class="grid"><label>Код раздела (латиница, цифры, дефис)<input id="slug" required pattern="[a-z0-9-]{2,80}" maxlength="80" placeholder="new-course"></label><label>Где показывать<select id="placement"><option value="main">Главная PracticAI</option><option value="education">Образование</option></select></label></div><label>Заголовок<input id="title" required maxlength="200"></label><label>Текст<textarea id="body" maxlength="10000" placeholder="Основной текст раздела"></textarea></label><div class="grid"><label>Порядок<input id="sort_order" type="number" value="0" min="-10000" max="10000"></label><label>Статус<select id="published"><option value="1">Опубликован</option><option value="0">Черновик</option></select></label></div><div class="actions"><button type="submit">Сохранить</button><button type="button" id="clear" class="ghost">Новый раздел</button></div></form></div><div class="panel"><h2>Разделы сайта</h2><div id="sections">Загрузка...</div></div></section><section id="contacts-panel" class="panel hidden"><h2>Обращения</h2><div id="contacts">Загрузка...</div></section></main><script>
const $=s=>document.querySelector(s),message=$('#message');let sections=[];
async function api(path,options={}){const r=await fetch('/api/admin/'+path,{...options,headers:{'Content-Type':'application/json','X-Requested-With':'PracticAI-CRM',...(options.headers||{})}});const data=await r.json();if(!r.ok)throw Error(data.error||'Ошибка запроса');return data}
function say(t){message.textContent=t;setTimeout(()=>{if(message.textContent===t)message.textContent=''},5000)}
function reset(){ $('#section-form').reset();$('#id').value='';$('#sort_order').value='0';$('#form-title').textContent='Добавить раздел'}
function row(label,text){const p=document.createElement('p');const b=document.createElement('strong');b.textContent=label+' ';p.append(b,document.createTextNode(text||''));return p}
async function loadSections(){const data=await api('content');sections=data.sections;const root=$('#sections');root.replaceChildren();if(!sections.length)root.textContent='Дополнительных разделов пока нет.';for(const s of sections){const article=document.createElement('article');article.className='item';const h=document.createElement('h3');h.textContent=s.title;article.append(h,row('Место:',s.placement==='main'?'Главная':'Образование'),row('Код:',s.slug),row('Статус:',s.published?'Опубликован':'Черновик'));const controls=document.createElement('div');controls.className='actions';const edit=document.createElement('button');edit.textContent='Изменить';edit.onclick=()=>{for(const field of ['id','slug','placement','title','body','sort_order','published'])$('#'+field).value=String(s[field]);$('#form-title').textContent='Редактировать раздел';scrollTo({top:0,behavior:'smooth'})};const remove=document.createElement('button');remove.textContent='Удалить';remove.className='danger';remove.onclick=async()=>{if(!confirm('Удалить раздел «'+s.title+'»?'))return;try{await api('content/'+s.id,{method:'DELETE'});await loadSections();say('Раздел удалён')}catch(e){say(e.message)}};controls.append(edit,remove);article.append(controls);root.append(article)}}
$('#section-form').onsubmit=async e=>{e.preventDefault();const id=$('#id').value;const body={slug:$('#slug').value,placement:$('#placement').value,title:$('#title').value,body:$('#body').value,sort_order:Number($('#sort_order').value),published:Number($('#published').value)};try{await api('content'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(body)});reset();await loadSections();say('Сохранено и доступно на сайте')}catch(e){say(e.message)}};
$('#clear').onclick=reset;
async function loadTexts(){const {texts}=await api('texts');for(const k of ['main_title','main_contact_intro','education_title','education_intro'])$('#'+k).value=texts[k]||''}
$('#texts-form').onsubmit=async e=>{e.preventDefault();const data={};for(const k of ['main_title','main_contact_intro','education_title','education_intro'])data[k]=$('#'+k).value;try{await api('texts',{method:'PUT',body:JSON.stringify(data)});say('Тексты сохранены')}catch(e){say(e.message)}};
async function loadContacts(){const data=await api('contacts');const root=$('#contacts');root.replaceChildren();if(!data.contacts.length)root.textContent='Обращений пока нет.';for(const c of data.contacts){const article=document.createElement('article');article.className='item';const h=document.createElement('h3');h.textContent='#'+c.id+' · '+c.name;const date=document.createElement('div');date.className='meta';date.textContent=new Date(c.created_at).toLocaleString('ru-RU');article.append(h,date,row('Телефон:',c.phone),row('Email:',c.email),row('Сообщение:',c.message));const label=document.createElement('label');label.textContent='Статус';const select=document.createElement('select');select.className='status';for(const [value,text] of [['new','Новое'],['read','Прочитано'],['replied','Ответили']]){const o=document.createElement('option');o.value=value;o.textContent=text;select.append(o)}select.value=c.status;select.onchange=async()=>{try{await api('contacts/'+c.id,{method:'PATCH',body:JSON.stringify({status:select.value})});say('Статус сохранён')}catch(e){say(e.message)}};label.append(select);article.append(label);root.append(article)}}
$('#tab-content').onclick=()=>{$('#content-panel').classList.remove('hidden');$('#contacts-panel').classList.add('hidden')};$('#tab-contacts').onclick=()=>{$('#content-panel').classList.add('hidden');$('#contacts-panel').classList.remove('hidden');loadContacts().catch(e=>say(e.message))};Promise.all([loadSections(),loadTexts()]).catch(e=>say(e.message));
</script></body></html>
