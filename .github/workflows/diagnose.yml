name: 🔍 Diagnose Server

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Full Diagnosis
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # HTTP check
          echo "## 🌐 HTTP Response" >> $GITHUB_STEP_SUMMARY
          HTTP_CODE=$(curl -s -o /tmp/http_body.txt -w "%{http_code}" --max-time 15 "http://practicai.ru/" 2>&1)
          echo "**HTTP Code:** $HTTP_CODE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -5 /tmp/http_body.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Headers
          echo "## 📋 Response Headers" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -sI --max-time 10 "http://practicai.ru/" >> $GITHUB_STEP_SUMMARY 2>&1
          echo '```' >> $GITHUB_STEP_SUMMARY

          # FTP listings
          echo "## 📂 FTP Structure" >> $GITHUB_STEP_SUMMARY
          for dir in "/practicai.ru/" "/practicai.ru/htdocs/" "/practicai.ru/htdocs/www/" "/practicai.ru/projects/" "/practicai.ru/projects/www/"; do
            echo "### $dir" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            curl -sl --max-time 15 \
              "ftp://ftp7.hostland.ru${dir}" \
              --user "host1688282_practicai:${FTP_PASS}" >> $GITHUB_STEP_SUMMARY 2>&1 || echo "TIMEOUT/ERR" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

          # /api/health
          echo "## 💊 /api/health" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -sk --max-time 10 "https://practicai.ru/api/health" >> $GITHUB_STEP_SUMMARY 2>&1 || echo "FAIL" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "✅ Diagnostic complete"
