name: 🚀 Deploy to Hostland — practicai.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: FTP Deploy → practicai.ru
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: 🔧 Install dependencies
        run: npm install --omit=dev

      - name: 📝 Создать .env
        run: |
          printf 'NODE_ENV=production\nPORT=3000\nALLOWED_ORIGIN=https://practicai.ru\nDB_HOST=localhost\nDB_USER=host1688282_practicai\nDB_PASSWORD=%s\nDB_NAME=host1688282_practicai\nDB_PORT=3306\n' "${{ secrets.DB_PASSWORD }}" > .env

      - name: 🔄 Обновить tmp/restart.txt (перезапуск Passenger)
        run: |
          mkdir -p tmp
          date > tmp/restart.txt

      - name: 📡 FTP Deploy → /practicai.ru/projects/www/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ftp7.hostland.ru
          username:    host1688282_practicai
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        21
          protocol:    ftp
          # ✅ Правильный путь согласно документации hostland:
          # /home/host1688282/practicai.ru/projects/www/
          server-dir:  /practicai.ru/projects/www/
          local-dir:   ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .env.example
            README.md
            *.log
            node_modules/.cache/**
