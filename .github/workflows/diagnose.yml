name: 🔍 Diagnose Server

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 🔍 Собрать диагностику
        run: |
          mkdir -p diagnostics
          
          echo "=== HTTP ответ practicai.ru ===" > diagnostics/result.txt
          curl -sI --max-time 20 https://practicai.ru/ >> diagnostics/result.txt 2>&1
          
          echo "" >> diagnostics/result.txt
          echo "=== Тело ответа (500 байт) ===" >> diagnostics/result.txt
          curl -sL --max-time 20 https://practicai.ru/ 2>&1 | head -c 500 >> diagnostics/result.txt
          
          echo "" >> diagnostics/result.txt
          echo "=== FTP: корень ===" >> diagnostics/result.txt
          curl -s --list-only "ftp://ftp7.hostland.ru/" \
            --user "host1688282_practicai:Farpost100!@" --max-time 20 >> diagnostics/result.txt 2>&1
          
          echo "" >> diagnostics/result.txt
          echo "=== FTP: practicai.ru/ ===" >> diagnostics/result.txt
          curl -s --list-only "ftp://ftp7.hostland.ru/practicai.ru/" \
            --user "host1688282_practicai:Farpost100!@" --max-time 20 >> diagnostics/result.txt 2>&1
          
          echo "" >> diagnostics/result.txt
          echo "=== FTP: htdocs/www/ ===" >> diagnostics/result.txt
          curl -s --list-only "ftp://ftp7.hostland.ru/practicai.ru/htdocs/www/" \
            --user "host1688282_practicai:Farpost100!@" --max-time 20 >> diagnostics/result.txt 2>&1

          echo "" >> diagnostics/result.txt
          echo "=== FTP: projects/www/ ===" >> diagnostics/result.txt
          curl -s --list-only "ftp://ftp7.hostland.ru/practicai.ru/projects/www/" \
            --user "host1688282_practicai:Farpost100!@" --max-time 20 >> diagnostics/result.txt 2>&1
          
          echo "" >> diagnostics/result.txt
          echo "=== FTP: htdocs/ ===" >> diagnostics/result.txt  
          curl -s --list-only "ftp://ftp7.hostland.ru/practicai.ru/htdocs/" \
            --user "host1688282_practicai:Farpost100!@" --max-time 20 >> diagnostics/result.txt 2>&1
          
          cat diagnostics/result.txt
      
      - name: 📤 Пушим результат в репо
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add diagnostics/result.txt
          git commit -m "🔍 Diagnostic results $(date)" || echo "No changes"
          git push origin main
