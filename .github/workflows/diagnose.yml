name: 🔍 Diagnose Server

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🔍 Собрать диагностику
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p diagnostics
          {
            echo "=== ДАТА ==="
            date
            
            echo ""
            echo "=== HTTP ответ ==="
            curl -sI --max-time 20 https://practicai.ru/
            
            echo ""
            echo "=== Тело ==="
            curl -sL --max-time 20 https://practicai.ru/ | head -c 500
            
            echo ""
            echo "=== FTP: все каталоги в projects/ ==="
            curl -s --list-only "ftp://ftp7.hostland.ru/practicai.ru/projects/" \
              --user "host1688282_practicai:${FTP_PASSWORD}" --max-time 20
            
            echo ""
            echo "=== FTP: чтение passenger_log через FTP ==="
            curl -s "ftp://ftp7.hostland.ru/../passenger_log" \
              --user "host1688282_practicai:${FTP_PASSWORD}" --max-time 20 | tail -50 || echo "недоступен"
            
            echo ""
            echo "=== FTP: projects/www/tmp/ ==="
            curl -s --list-only "ftp://ftp7.hostland.ru/practicai.ru/projects/www/tmp/" \
              --user "host1688282_practicai:${FTP_PASSWORD}" --max-time 20
            
            echo ""
            echo "=== FTP: все каталоги в projects/digital/ (если есть) ==="
            curl -s --list-only "ftp://ftp7.hostland.ru/practicai.ru/projects/digital/" \
              --user "host1688282_practicai:${FTP_PASSWORD}" --max-time 20 || echo "нет"
              
          } > diagnostics/result.txt 2>&1
          cat diagnostics/result.txt

      - name: 💾 Коммит результата
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add diagnostics/result.txt
          git diff --staged --quiet || (git commit -m "diag $(date +%s)" && git push)
