<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Управление сайтом — PracticAI</title><link rel="stylesheet" href="/cms-admin.css"></head><body><header class="top"><a href="/admin/cms">PracticAI · Управление сайтом</a><a href="/admin">Обращения и консультант →</a></header><div class="workspace"><aside><h2>Содержание сайта</h2><nav id="documents" aria-label="Разделы сайта"></nav><button id="create">+ Создать страницу</button><form id="create-form" hidden><label>Название<input name="title" required maxlength="200"></label><label>Адрес страницы<input name="slug" required pattern="[a-zA-Z0-9-]{2,80}" placeholder="new-page"></label><p class="hint">Адрес: /pages/… · латинские буквы, цифры и дефис</p><button type="submit">Создать черновик</button></form><h2>Материалы</h2><label class="upload">Загрузить изображение или PDF<input id="upload" type="file" accept="image/png,image/jpeg,image/webp,application/pdf"></label><p class="hint">Изображения до 3 МБ, PDF до 10 МБ. После загрузки скопируйте адрес в поле изображения или ссылки.</p><div id="media"></div></aside><main><div id="notice" role="status" aria-live="polite"></div><div class="toolbar"><div><small id="breadcrumb">Содержание сайта</small><h1 id="heading">Загрузка…</h1><p id="status"></p></div><div class="actions"><button id="save" disabled>Сохранить черновик</button><button id="publish" disabled>Опубликовать</button><button id="preview" disabled>Предпросмотр</button></div></div><div id="editor"></div><section id="history"></section><section id="preview-panel" hidden><div class="actions"><h2>Предпросмотр черновика</h2><button id="desktop">Компьютер</button><button id="mobile">Телефон</button><button id="close-preview">Закрыть</button></div><iframe title="Предпросмотр страницы" sandbox="allow-same-origin"></iframe></section></main></div><script src="/cms-admin.js" defer></script></body></html>
