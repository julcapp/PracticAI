name: 🚀 Deploy PracticAI → Hostland

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: practicai-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: 🔧 Установить зависимости
        run: npm ci

      - name: 🧪 Проверить консультанта и CRM до публикации
        run: npm test

      - name: 📦 Оставить только зависимости сервера
        run: npm prune --omit=dev

      - name: 🧩 Собрать главную с образовательными разделами
        run: python3 scripts/prepare-public.py

      - name: 📝 Создать .env
        env:
          DEPLOY_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DEPLOY_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DEPLOY_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DEPLOY_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const config = {
            NODE_ENV: 'production',
            PORT: '3000',
            ALLOWED_ORIGIN: 'https://practicai.ru',
            DB_HOST: 'localhost',
            DB_USER: 'host1688282_practicai',
            DB_PASSWORD: process.env.DEPLOY_DB_PASSWORD || '',
            DB_NAME: 'host1688282_practicai',
            DB_PORT: '3306',
            ADMIN_USER: 'admin',
            ADMIN_PASSWORD: process.env.DEPLOY_ADMIN_PASSWORD || '',
            SITE_ORIGIN: 'https://practicai.ru',
            SMTP_HOST: 'mail.hostland.ru',
            SMTP_PORT: '465',
            SMTP_USER: 'no-reply@practicai.ru',
            SMTP_PASSWORD: process.env.DEPLOY_SMTP_PASSWORD || '',
            MAIL_FROM: 'no-reply@practicai.ru',
            CONTACT_EMAIL: 'practic@practicai.ru',
            OPENAI_API_KEY: process.env.DEPLOY_OPENAI_API_KEY || '',
            OPENAI_MODEL: 'gpt-5-mini',
          };
          fs.writeFileSync('.env', Object.entries(config).map(([key, value]) => `${key}=${JSON.stringify(value)}`).join('\n') + '\n', { mode: 0o600 });
          NODE

      - name: 🔄 Обновить tmp/restart.txt
        run: |
          mkdir -p tmp
          date +%s > tmp/restart.txt

      - name: 📡 Deploy → /projects/www/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ftp7.hostland.ru
          username:    host1688282_practicai
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        21
          protocol:    ftp
          server-dir:  /practicai.ru/projects/www/
          local-dir:   ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*/**
            .github/**
            .env.example
            README.md
            *.log
            node_modules/.cache/**
            htdocs_only/**
            diagnostics/**
            security_patch/**

      - name: 📡 Deploy → /projects/digital/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ftp7.hostland.ru
          username:    host1688282_practicai
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        21
          protocol:    ftp
          server-dir:  /practicai.ru/projects/digital/
          local-dir:   ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*/**
            .github/**
            .env.example
            README.md
            *.log
            node_modules/.cache/**
            htdocs_only/**
            diagnostics/**
            security_patch/**

      - name: 🔒 Закрыть старый файл миграции в htdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp7.hostland.ru
          username: host1688282_practicai
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          server-dir: /practicai.ru/htdocs/www/
          local-dir: ./security_patch/
          dangerous-clean-slate: false

      - name: 📄 Обновить публичные страницы в корневой папке сайта
        env:
          DEPLOY_FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for filename in index.html education.html courses/accountants.html site-enhancements.js managed-blocks.css responsive-brand.css assistant-widget.js assistant-widget.css favicon.svg; do
            curl --fail --silent --show-error --ftp-create-dirs \
              --user "host1688282_practicai:$DEPLOY_FTP_PASSWORD" \
              --upload-file "public/$filename" \
              "ftp://ftp7.hostland.ru/practicai.ru/htdocs/www/$filename"
          done
          curl --fail --silent --show-error --ftp-create-dirs \
            --user "host1688282_practicai:$DEPLOY_FTP_PASSWORD" \
            --upload-file public/brand/practicai-logo.svg \
            "ftp://ftp7.hostland.ru/practicai.ru/htdocs/www/brand/practicai-logo.svg"
          curl --fail --silent --show-error --ftp-create-dirs \
            --user "host1688282_practicai:$DEPLOY_FTP_PASSWORD" \
            --upload-file public/brand/practicai-mark.svg \
            "ftp://ftp7.hostland.ru/practicai.ru/htdocs/www/brand/practicai-mark.svg"

      - name: 📄 Проверить разделы на основном домене
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 https://practicai.ru/ -o homepage.html \
              && grep -q 'id="course-catalog"' homepage.html \
              && grep -q 'id="organization"' homepage.html \
              && curl --fail --silent --show-error --max-time 20 https://practicai.ru/education.html -o education-live.html \
              && grep -q 'id="details"' education-live.html; then
              echo "Главная, каталог и сведения доступны"
              exit 0
            fi
            sleep 8
          done
          exit 1

      - name: 🩺 Проверить состояние API после перезапуска
        if: ${{ !cancelled() }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 https://practicai.ru/api/health; then
              exit 0
            fi
            sleep 8
          done
          exit 1

      - name: 🧩 Проверить редактор и стили CRM
        if: ${{ !cancelled() }}
        env:
          DEPLOY_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          curl --fail --silent --show-error --max-time 25 --user "admin:$DEPLOY_ADMIN_PASSWORD" https://practicai.ru/admin -o crm-live.html
          grep -q 'Предварительный просмотр блока' crm-live.html
          grep -q 'id="scenarios-panel"' crm-live.html
          curl --fail --silent --show-error --max-time 25 --user "admin:$DEPLOY_ADMIN_PASSWORD" https://practicai.ru/api/admin/scenarios -o scenarios-live.json
          node -e 'const d=JSON.parse(require("node:fs").readFileSync("scenarios-live.json","utf8"));if(!Array.isArray(d.scenarios)||!Array.isArray(d.directions))process.exit(1)'
          curl --fail --silent --show-error --max-time 25 https://practicai.ru/managed-blocks.css -o blocks-live.css
          grep -q '.managed-section' blocks-live.css

      - name: 🩺 Проверить таблицы CRM
        if: ${{ !cancelled() }}
        env:
          DEPLOY_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          response=$(curl --fail --silent --show-error --max-time 20 --user "admin:$DEPLOY_ADMIN_PASSWORD" https://practicai.ru/api/admin/diagnostics)
          echo "$response"
          echo "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s).checks;if(Object.values(c).some(v=>v!=="ok"))process.exit(1)})'

      - name: 📚 Проверить страницу бухгалтерского курса
        if: ${{ !cancelled() }}
        run: |
          curl --fail --silent --show-error --max-time 30 https://practicai.ru/courses/accountants.html -o accountants-live.html
          grep -q 'id="pa-accountants"' accountants-live.html
          grep -q '/api/contact' accountants-live.html
          grep -q '/courses/accountants.html' homepage.html
          grep -q '/courses/accountants.html' education-live.html

      - name: 🤖 Проверить ответ консультанта
        if: ${{ !cancelled() }}
        run: |
          curl --fail --silent --show-error --max-time 40 https://practicai.ru/assistant-widget.js -o assistant-live.js
          grep -q '/api/assistant' assistant-live.js
          curl --fail --silent --show-error --max-time 40 https://practicai.ru/api/assistant \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://practicai.ru' \
            --data '{"message":"Какие направления обучения есть?","history":[]}' -o assistant-response.json
          node - <<'NODE'
          const data = JSON.parse(require('node:fs').readFileSync('assistant-response.json', 'utf8'));
          console.log('Режим консультанта:', data.mode || 'error');
          if (data.reason) console.log('Причина резервного ответа:', data.reason);
          if (!['ai', 'guide'].includes(data.mode) || typeof data.answer !== 'string' || !data.answer.trim()) {
            console.error('Консультант не вернул ответ.');
            process.exit(1);
          }
          if(data.mode !== 'guide' || !Array.isArray(data.choices)) process.exit(1);
          console.log('Консультант отвечает по управляемым сценариям.');
          NODE

