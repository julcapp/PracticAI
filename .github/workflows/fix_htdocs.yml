name: 🔧 Fix htdocs - remove default files

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: 🗑️ Remove default index files from htdocs/www/
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          HOST="ftp7.hostland.ru"
          USER="host1688282_practicai"

          # Удаляем дефолтные файлы которые перехватывают запросы
          for file in "index.htm" "index.php" "index.html"; do
            echo "Deleting /practicai.ru/htdocs/www/$file ..."
            curl -s --max-time 15 --ftp-pasv \
              "ftp://${HOST}/practicai.ru/htdocs/www/${file}" \
              --user "${USER}:${FTP_PASS}" \
              -Q "DELE /practicai.ru/htdocs/www/${file}" \
              2>&1 || true

            # Альтернативный способ через FTP DELE
            curl -s --max-time 15 \
              --ftp-pasv \
              --quote "DELE practicai.ru/htdocs/www/${file}" \
              "ftp://${HOST}/" \
              --user "${USER}:${FTP_PASS}" \
              2>&1 || true
          done

          echo "Listing htdocs/www/ after cleanup:"
          curl -sl --max-time 15 --ftp-pasv \
            "ftp://${HOST}/practicai.ru/htdocs/www/" \
            --user "${USER}:${FTP_PASS}" 2>&1
