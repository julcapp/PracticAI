name: 🚀 Deploy PracticAI → Hostland

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: 🔧 npm install (production deps + node_modules для сервера)
        run: npm install --omit=dev

      - name: 📝 Создать .env
        run: |
          cat > .env << EOF
          NODE_ENV=production
          PORT=3000
          ALLOWED_ORIGIN=https://practicai.ru
          DB_HOST=localhost
          DB_USER=host1688282_practicai
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=host1688282_practicai
          DB_PORT=3306
          EOF

      - name: 🔄 Обновить tmp/restart.txt → перезапуск Passenger
        run: |
          mkdir -p tmp
          date +%s > tmp/restart.txt

      - name: 📡 Deploy → /practicai.ru/projects/www/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ftp7.hostland.ru
          username:    host1688282_practicai
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        21
          protocol:    ftp
          server-dir:  /practicai.ru/projects/www/
          local-dir:   ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .env.example
            README.md
            *.log
            node_modules/.cache/**
