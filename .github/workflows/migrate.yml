name: 🗄️ Run DB Migration

on:
  workflow_dispatch:  # только ручной запуск

jobs:
  migrate:
    name: Create MySQL tables
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔧 Install dependencies
        run: npm install --omit=dev

      - name: 📝 Создать .env
        run: |
          printf 'NODE_ENV=production\nPORT=3000\nALLOWED_ORIGIN=https://practicai.ru\nDB_HOST=localhost\nDB_USER=host1688282_practicai\nDB_PASSWORD=%s\nDB_NAME=host1688282_practicai\nDB_PORT=3306\n' "${{ secrets.DB_PASSWORD }}" > .env

      - name: 🗄️ Run migration
        run: node migrate.js
