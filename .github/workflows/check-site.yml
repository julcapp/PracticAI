name: Проверка PracticAI

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить редактор CRM
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          curl --fail --silent --show-error --max-time 25 --user "admin:$ADMIN_PASSWORD" https://practicai.ru/admin -o admin.html
          grep -q 'Предварительный просмотр блока' admin.html
          curl --fail --silent --show-error --max-time 25 https://practicai.ru/managed-blocks.css -o blocks.css
          grep -q '.managed-section' blocks.css
